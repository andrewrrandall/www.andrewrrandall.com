<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    {% feed_meta %}
    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
    <link rel="icon" href="{{ '/photos/IMG_0043.JPG' | relative_url }}" type="image/jpeg">
</head>
<body>
    <header class="site-header no-print">
        <h1><a href="{{ '/' | relative_url }}">{{ page.heading | default: "my writing" }}</a></h1>
        <nav class="site-nav">
            <a href="{{ '/' | relative_url }}">home</a>
            <a href="{{ '/blogs/writing.html' | relative_url }}">writing</a>
            <a href="{{ '/resume.html' | relative_url }}">resume</a>
        </nav>
    </header>
    <main class="{{ page.main_class | default: 'content' }}">
        {{ content }}
    </main>
    <footer class="site-footer no-print">
        <p>&copy; {{ site.time | date: "%Y" }} andrewrrandall.com &middot; <a href="{{ '/feed.xml' | relative_url }}">rss</a></p>
    </footer>
</body>
</html>
